<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.notfound.title">Página no encontrada — Arima Play</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4eee2">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      try {
        var query = new URLSearchParams(location.search).get("lang");
        var stored = localStorage.getItem("arimaplay-lang");
        var lang;
        if (query) {
          lang = query.toLowerCase().slice(0, 2) === "en" ? "en" : "es";
        } else if (stored) {
          lang = stored.toLowerCase().slice(0, 2) === "en" ? "en" : "es";
        } else {
          lang = (navigator.language || "es").toLowerCase().indexOf("es") === 0 ? "es" : "en";
        }
        document.documentElement.lang = lang;
      } catch (err) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html" data-i18n-aria-label="logo.home" aria-label="Arima Play, ir al inicio">
        <img class="site-logo" src="assets/images/logo-arimaplay.png" width="840" height="240" alt="Arima Play">
      </a>
      <div class="header-tools">
        <div class="lang-switch" role="group" data-i18n-aria-label="lang.label" aria-label="Idioma">
          <button type="button" data-set-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>
  <main class="not-found wrap">
    <div>
      <p class="eyebrow" data-i18n="notfound.eyebrow">Error 404</p>
      <h1 data-i18n="notfound.title">Esta página no está en el tablero</h1>
      <p class="lead" data-i18n="notfound.lead">La dirección no existe o se ha movido. Vuelve al inicio de Arima Play.</p>
      <p><a class="button" href="index.html" data-i18n="notfound.home">Ir al inicio</a></p>
    </div>
  </main>
  <script src="js/i18n.js"></script>
</body>
</html>
