  <script>
    (function () {
      try {
        var query = new URLSearchParams(location.search).get("lang");
        var stored = localStorage.getItem("arimaplay-lang");
        var lang;
        if (query) {
          lang = query.toLowerCase().slice(0, 2) === "en" ? "en" : "es";
        } else if (stored) {
          lang = stored.toLowerCase().slice(0, 2) === "en" ? "en" : "es";
        } else {
          lang = (navigator.language || "es").toLowerCase().indexOf("es") === 0 ? "es" : "en";
        }
        document.documentElement.lang = lang;
      } catch (err) {}
    })();
  </script>
